name: Maryruss portable Windows
on:
  push:
    branches: [entrega/maryruss-windows11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python manage.py test --noinput
      - run: python -m PyInstaller --noconfirm --clean desktop/Maryruss.spec
      - run: python desktop/smoke_check.py dist/Maryruss/Maryruss.exe
      - shell: pwsh
        run: |
          Copy-Item desktop/LEEME.txt dist/Maryruss/LEEME.txt
          Compress-Archive -Path dist/Maryruss -DestinationPath dist/Maryruss-Windows11.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Maryruss-Windows11
          path: dist/Maryruss-Windows11.zip
